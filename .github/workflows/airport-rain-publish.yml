name: One-time airport rainfall repair release
on:
  push:
    paths:
      - '.github/workflows/airport-rain-publish.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: psh-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - name: Collect Isaias with certified METAR hour gap recovery
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          STORM_NAME: Hurricane Isaias
          START_UTC: '2026-10-08'
          END_UTC: '2026-10-09'
          RAIN_START_UTC: '2026-10-08T00:00:00Z'
          RAIN_END_UTC: '2026-10-10T00:00:00Z'
        run: python scripts/build.py
      - name: Validate collected workbook
        run: python scripts/validate.py
      - name: Publish only validated output
        run: |
          python scripts/export_dashboard.py
          python scripts/validate.py --site
      - uses: actions/upload-artifact@v4
        with:
          name: Isaias-certified-airport-rain
          path: output/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy refreshed PSH
        id: deployment
        uses: actions/deploy-pages@v4
