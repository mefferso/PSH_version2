name: One-time PSH observed-data policy release
# Final rainfall source priority review.
on:
  push:
    paths: ['.github/workflows/observed-data-release.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: psh-pages
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - name: Collect Isaias observed and incomplete measurements
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          STORM_NAME: Hurricane Isaias
          START_UTC: '2026-10-08'
          END_UTC: '2026-10-09'
          RAIN_START_UTC: '2026-10-08T00:00:00Z'
          RAIN_END_UTC: '2026-10-10T00:00:00Z'
        run: python scripts/build.py
      - run: python scripts/validate.py
      - run: |
          python scripts/export_dashboard.py
          python scripts/validate.py --site
      - uses: actions/upload-artifact@v4
        with:
          name: Isaias-observed-data-review
          path: output/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy verified observations
        id: deploy
        uses: actions/deploy-pages@v4
