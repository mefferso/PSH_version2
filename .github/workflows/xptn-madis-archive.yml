name: XPTN MADIS archive experiment
on:
  push:
    branches:
      - experiment/xptn-madis-archive
    paths:
      - experiments/xptn_madis_archive.py
      - .github/workflows/xptn-madis-archive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NetCDF dependencies
        run: python -m pip install requests numpy netCDF4
      - name: Retrieve and inspect three XPTN MADIS archive hours
        run: python experiments/xptn_madis_archive.py
      - name: Publish test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xptn-madis-archive-report
          path: |
            xptn_madis_result.json
            xptn_madis_report.md
          if-no-files-found: warn
