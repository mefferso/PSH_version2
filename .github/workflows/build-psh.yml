name: Build PSH workbook
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'requirements.txt'
      - '.github/workflows/build-psh.yml'
  workflow_dispatch:
    inputs:
      storm_name:
        description: "Storm name and type (e.g. Hurricane Francine)"
        required: true
        default: "Hurricane Isaias"
        type: string
      start_utc:
        description: "First UTC date YYYY-MM-DD"
        required: true
        default: "2026-10-08"
        type: string
      end_utc:
        description: "Last UTC date YYYY-MM-DD"
        required: true
        default: "2026-10-09"
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: psh-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test collector adapters
        run: python -m unittest discover -s tests -v
      - name: Build workbook and QC
        env:
          STORM_NAME: ${{ inputs.storm_name || 'Hurricane Isaias' }}
          START_UTC: ${{ inputs.start_utc || '2026-10-08' }}
          END_UTC: ${{ inputs.end_utc || '2026-10-09' }}
        run: python scripts/build.py
      - name: Export dashboard data
        run: python scripts/export_dashboard.py
      - name: Upload workbook and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSH-output-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
