name: Audit airport rainfall gaps
on:
  push:
    paths: ['.github/workflows/audit-airport-rain.yml']
permissions:
  contents: read
jobs:
  airport-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect IEM processed hourly archive and METAR coverage
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import datetime as dt,requests
          import hourlyprecip
          a=dt.datetime(2026,10,8,tzinfo=dt.timezone.utc)
          b=dt.datetime(2026,10,10,tzinfo=dt.timezone.utc)
          for network,stations in [('LA_ASOS',['MSY','BTR','NEW','ASD']),('MS_ASOS',['BIX','GPT','PQL','MCB'])]:
              for sid in stations:
                  try:
                      r=requests.get(hourlyprecip.URL,params={'network':network,'station':sid,'sts':'2026-10-08T00:00:00Z','ets':'2026-10-10T00:00:00Z','tz':'Etc/UTC'},timeout=40)
                      r.raise_for_status()
                      print('STATION',sid,'NETWORK',network,'HEADER',repr(r.text[:200]))
                      summary=hourlyprecip.coverage_details(r.text,sid,network,a,b)
                      print('SUMMARY',sid,summary)
                      print('TOTAL',sid,hourlyprecip.parse(r.text,sid,network,a,b)[0])
                  except Exception as e:print('ERROR',sid,type(e).__name__,str(e)[:180])
          PY
